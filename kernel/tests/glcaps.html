<!doctype html>
<body>
<script>
// Emits one line of key=value pairs with what WebGL says the graphics card can do.
const out = [];
const show = value => value === null ? 'null'
    : (ArrayBuffer.isView(value) ? value.constructor.name + ':' + Array.from(value).join('/') : typeof value + ':' + value);
function precision(gl, shader, type) {
  const format = gl.getShaderPrecisionFormat(shader, type);
  return format ? [format.rangeMin, format.rangeMax, format.precision].join('/') : 'null';
}
function describe(prefix, gl) {
  if (!gl) { out.push(prefix + '=none'); return; }
  out.push(prefix + '=ok');
  out.push(prefix + 'Max=' + show(gl.getParameter(gl.MAX_TEXTURE_SIZE)));
  out.push(prefix + 'Dims=' + show(gl.getParameter(gl.MAX_VIEWPORT_DIMS)));
  out.push(prefix + 'Point=' + show(gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)));
  // 0x8073 is MAX_3D_TEXTURE_SIZE: a WebGL 2 parameter, an error in WebGL 1.
  out.push(prefix + 'Tex3d=' + show(gl.getParameter(0x8073)));
  out.push(prefix + 'Error=' + gl.getError());
  // 0x84FF is MAX_TEXTURE_MAX_ANISOTROPY_EXT: null until its extension is enabled.
  out.push(prefix + 'AnisoBefore=' + show(gl.getParameter(0x84FF)));
  gl.getError();
  const extensions = gl.getSupportedExtensions();
  out.push(prefix + 'ExtCount=' + extensions.length);
  for (const name of ['EXT_texture_filter_anisotropic', 'OES_element_index_uint', 'EXT_color_buffer_float',
                      'WEBGL_debug_renderer_info', 'NOT_A_real_extension']) {
    out.push(prefix + '_' + name + '=' + extensions.includes(name) + '/' + (gl.getExtension(name) !== null));
  }
  out.push(prefix + 'AnisoAfter=' + show(gl.getParameter(0x84FF)));
  gl.getError();
  out.push(prefix + 'VertexHighFloat=' + precision(gl, gl.VERTEX_SHADER, gl.HIGH_FLOAT));
  out.push(prefix + 'FragmentLowInt=' + precision(gl, gl.FRAGMENT_SHADER, gl.LOW_INT));
  // What goes beyond a limit is refused, and what is at it is not: the error of each.
  const tried = run => { gl.getError(); run(); return gl.getError(); };
  const both = (limit, run) => tried(() => run(limit)) + '/' + tried(() => run(limit + 1));
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  out.push(prefix + 'TexEdge=' + both(gl.getParameter(gl.MAX_TEXTURE_SIZE),
      size => gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null)));
  gl.bindRenderbuffer(gl.RENDERBUFFER, gl.createRenderbuffer());
  out.push(prefix + 'BufferEdge=' + both(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
      size => gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA4, size, 1)));
  out.push(prefix + 'AttribEdge=' + both(gl.getParameter(gl.MAX_VERTEX_ATTRIBS) - 1,
      index => gl.enableVertexAttribArray(index)));
  out.push(prefix + 'UnitEdge=' + both(gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS) - 1,
      unit => gl.activeTexture(gl.TEXTURE0 + unit)));
  gl.activeTexture(gl.TEXTURE0);
  // Shaders: one that uses as many uniforms, or samplers, as the card has is linked,
  // and one that uses one more is not.
  const links = (vertex, fragment) => {
    const program = gl.createProgram();
    for (const [type, source] of [[gl.VERTEX_SHADER, vertex], [gl.FRAGMENT_SHADER, fragment]]) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      gl.attachShader(program, shader);
    }
    gl.linkProgram(program);
    return gl.getProgramParameter(program, gl.LINK_STATUS);
  };
  const plainFragment = 'precision mediump float; void main() { gl_FragColor = vec4(1.0); }';
  const withUniforms = count => links(
      `attribute float index; uniform vec4 values[${count}]; void main() { gl_Position = values[int(index)]; }`, plainFragment);
  const withSamplers = count => links('void main() { gl_Position = vec4(0.0); }',
      'precision mediump float;' + Array.from({ length: count }, (_, i) => `uniform sampler2D s${i};`).join('') +
      'void main() { gl_FragColor = ' + Array.from({ length: count }, (_, i) => `texture2D(s${i}, vec2(0.0))`).join(' + ') + '; }');
  const uniforms = Math.min(gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS), 1024);
  out.push(prefix + 'UniformEdge=' + withUniforms(uniforms) + '/' + (uniforms < 1024 ? withUniforms(uniforms + 1) : 'unlimited'));
  const samplers = gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS);
  out.push(prefix + 'SamplerEdge=' + withSamplers(samplers) + '/' + withSamplers(samplers + 1));
  gl.getError();
  // A canvas wider than the card can draw gets a drawing buffer no wider than it can.
  const wide = document.createElement('canvas');
  wide.width = gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0] + 904;
  wide.height = 8;
  const wideGl = wide.getContext(prefix === 'gl1' ? 'webgl' : 'webgl2');
  out.push(prefix + 'Wide=' + (wideGl ? wideGl.drawingBufferWidth : 'none'));
  // The native getter must still be the native getter.
  out.push(prefix + 'Native=' + /\{\s*\[native code\]\s*\}/.test(Function.prototype.toString.call(gl.getParameter)));
  // A parameter nobody forces keeps working.
  out.push(prefix + 'Version=' + encodeURIComponent(gl.getParameter(gl.VERSION)));
}
describe('gl1', document.createElement('canvas').getContext('webgl'));
describe('gl2', document.createElement('canvas').getContext('webgl2'));
document.body.innerText = 'RESULT ' + out.join(' ');
</script>
</body>
