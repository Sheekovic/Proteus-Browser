<!doctype html>
<body>
<!-- Holds the load event for a few real seconds: the voice list and the GPU adapter
     arrive asynchronously from other processes. -->
<img src="/slow?ms=4500" alt="">
<script>
// Emits one line of key=value pairs with the speech synthesis voices and the WebGPU
// adapter identity a page can see.
const enc = v => encodeURIComponent(String(v));
const within = (promise, ms, fallback) =>
    Promise.race([promise, new Promise(resolve => setTimeout(() => resolve(fallback), ms))]);

// How many voices the first question got, how many voiceschanged events came and how
// long after that question the first one did.
const arrival = { atOnce: -1, events: 0, firstAfterMs: -1 };

function voices() {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve([]);
    const read = () => speechSynthesis.getVoices();
    const asked = performance.now();
    speechSynthesis.addEventListener('voiceschanged', () => {
      if (arrival.events++ === 0) arrival.firstAfterMs = Math.round(performance.now() - asked);
    });
    arrival.atOnce = read().length;
    // Long enough for a second announcement of the list to be counted.
    setTimeout(() => resolve(read()), 2000);
  });
}

async function gpu() {
  try {
    if (!navigator.gpu) return 'unsupported';
    const adapter = await within(navigator.gpu.requestAdapter(), 2500, 'timeout');
    if (adapter === 'timeout') return 'timeout';
    if (!adapter) return 'no-adapter';
    const i = adapter.info || {};
    return `${i.vendor}|${i.architecture}|${i.device}|${i.description}`;
  } catch (e) {
    return 'error:' + e.name;
  }
}

(async () => {
  const [list, adapter] = await Promise.all([voices(), gpu()]);
  document.body.innerText = 'RESULT ' + [
    'voices=' + list.length,
    'voiceNames=' + enc(list.slice(0, 6).map(v => v.name + (v.localService ? '' : '*')).join('|') || 'none'),
    // name~lang~local~default~voiceURI for the first few voices.
    'voiceDetail=' + enc(list.slice(0, 4).map(
        v => [v.name, v.lang, v.localService, v.default, v.voiceURI].join('~')).join('|') || 'none'),
    'voicesAtOnce=' + arrival.atOnce,
    'voiceEvents=' + arrival.events,
    'voiceEventLate=' + (arrival.firstAfterMs >= 2 && arrival.firstAfterMs < 1000),
    'webgpu=' + enc(adapter),
  ].join(' ');
})();
</script>
</body>
