<!doctype html>
<body>
<script>
// Emits one line of key=value pairs describing what a page can read from WebGL.
function fnv(bytes) {
  let h = 0x811c9dc5;
  for (let i = 0; i < bytes.length; i++) {
    h ^= bytes[i];
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

const W = 160, H = 96;
const canvas = document.createElement('canvas');
canvas.width = W; canvas.height = H;
const gl = canvas.getContext('webgl', {preserveDrawingBuffer: true, antialias: false});

function finish(fields) {
  document.body.innerText = 'RESULT ' + fields.join(' ');
}

if (!gl) {
  finish(['webgl=none']);
} else {
  const info = gl.getExtension('WEBGL_debug_renderer_info');
  const vendor = info ? gl.getParameter(info.UNMASKED_VENDOR_WEBGL) : '';
  const renderer = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : '';

  function compile(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source); gl.compileShader(s);
    return s;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER,
      'attribute vec2 p; attribute vec3 c; varying vec3 v;' +
      'void main(){ v = c; gl_Position = vec4(p, 0.0, 1.0); }'));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER,
      'precision mediump float; varying vec3 v;' +
      'void main(){ gl_FragColor = vec4(v, 1.0); }'));
  gl.linkProgram(program); gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -0.9, -0.8, 1, 0, 0,   0.9, -0.6, 0, 1, 0,   0.1, 0.9, 0, 0, 1,
  ]), gl.STATIC_DRAW);
  const p = gl.getAttribLocation(program, 'p'), c = gl.getAttribLocation(program, 'c');
  gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(c); gl.vertexAttribPointer(c, 3, gl.FLOAT, false, 20, 8);
  gl.clearColor(0.1, 0.2, 0.3, 1.0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const full = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, full);
  const again = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, again);

  // A sub-rectangle read must agree with the full read.
  const X = 41, Y = 13, SW = 70, SH = 50;
  const part = new Uint8Array(SW * SH * 4);
  gl.readPixels(X, Y, SW, SH, gl.RGBA, gl.UNSIGNED_BYTE, part);
  let subrect = true;
  for (let y = 0; y < SH && subrect; y++) {
    for (let x = 0; x < SW * 4; x++) {
      if (part[y * SW * 4 + x] !== full[(Y + y) * W * 4 + X * 4 + x]) {
        subrect = false; break;
      }
    }
  }

  // Copying the WebGL canvas to a 2D canvas and reading that must give the same
  // pixels as readPixels (which is bottom-up).
  const flatCanvas = document.createElement('canvas');
  flatCanvas.width = W; flatCanvas.height = H;
  const g2 = flatCanvas.getContext('2d');
  g2.drawImage(canvas, 0, 0);
  const via2d = g2.getImageData(0, 0, W, H).data;
  let mismatches = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W * 4; x++) {
      if (via2d[y * W * 4 + x] !== full[(H - 1 - y) * W * 4 + x]) mismatches++;
    }
  }
  const dataUrl = canvas.toDataURL();

  // A single-colour framebuffer must read back exactly.
  gl.clearColor(0.2, 0.4, 0.6, 1.0); gl.clear(gl.COLOR_BUFFER_BIT);
  const flat = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, flat);
  let flatExact = true;
  for (let i = 4; i < flat.length; i++) {
    if (flat[i] !== flat[i % 4]) { flatExact = false; break; }
  }

  finish([
    'vendor=' + encodeURIComponent(vendor),
    'renderer=' + encodeURIComponent(renderer),
    'pixels=' + fnv(full),
    'url=' + fnv(new TextEncoder().encode(dataUrl)),
    'stable=' + (fnv(again) === fnv(full)),
    'subrect=' + subrect,
    'match2d=' + (mismatches === 0),
    'flat=' + flatExact,
  ]);
}
</script>
</body>
