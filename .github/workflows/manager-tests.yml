# Runs the manager's unit and API tests. They need no browser: the kernel is
# replaced by a stand-in (manager/test/stub-kernel.mjs).
#
# The kernel itself is not built here. A Chromium build needs far more disk and time
# than a hosted runner offers. Its tests run on a machine that has a built kernel
# (see the README).
name: Manager tests

on:
  push:
    paths:
      - 'manager/**'
      - '.github/workflows/manager-tests.yml'
  pull_request:
    paths:
      - 'manager/**'
      - '.github/workflows/manager-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        working-directory: manager
        run: npm test
